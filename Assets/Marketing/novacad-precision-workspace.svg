<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1000" viewBox="0 0 2500 1000" role="img" aria-labelledby="title description">
  <title id="title">NovaCAD Precision Workspace</title>
  <desc id="description">A dark marketing hero for NovaCAD with a polished native Mac application window and an original fictional industrial drawing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090d"/>
      <stop offset="0.58" stop-color="#0a1017"/>
      <stop offset="1" stop-color="#07131c"/>
    </linearGradient>
    <radialGradient id="blueAura" cx="76%" cy="48%" r="58%">
      <stop offset="0" stop-color="#208cff" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#27d9ff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#06090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a34"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="sideSurface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121b24"/>
      <stop offset="1" stop-color="#0c131a"/>
    </linearGradient>
    <pattern id="pageGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8aa1b4" stroke-opacity="0.045"/>
      <circle cx="0" cy="0" r="1.2" fill="#27d9ff" fill-opacity="0.08"/>
    </pattern>
    <pattern id="canvasGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8fa1b0" stroke-opacity="0.055"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V12" stroke="#8fa2b1" stroke-opacity="0.2"/>
    </pattern>
    <filter id="windowShadow" x="-25%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.68"/>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="appClip"><rect x="920" y="76" width="1490" height="846" rx="25"/></clipPath>
    <clipPath id="drawingClip"><rect x="1030" y="260" width="1115" height="565"/></clipPath>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M9 4.5L0 0V9Z" fill="#9aaab8"/>
    </marker>
    <marker id="routeArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12L3 6Z" fill="#ff604d"/>
    </marker>
  </defs>

  <rect width="2500" height="1000" fill="url(#background)"/>
  <rect width="2500" height="1000" fill="url(#blueAura)"/>
  <rect width="2500" height="1000" fill="url(#pageGrid)"/>

  <!-- Drawing fragments escaping the application frame -->
  <g fill="none" stroke="#27d9ff" stroke-opacity="0.18" filter="url(#cyanGlow)">
    <path d="M820 788H1054V707H1230M2245 160V52M2325 316H2480M2310 750L2464 904" stroke-width="2"/>
    <circle cx="2380" cy="163" r="92"/>
    <circle cx="2380" cy="163" r="62"/>
    <path d="M2288 163H2472M2380 71V255" stroke-width="1"/>
  </g>
  <g fill="#27d9ff" fill-opacity="0.38">
    <circle cx="820" cy="788" r="4"/><circle cx="1054" cy="707" r="4"/><circle cx="2325" cy="316" r="4"/>
  </g>

  <!-- Product message -->
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <g transform="translate(92 100)">
      <circle cx="8" cy="8" r="7" fill="#27d9ff" filter="url(#softGlow)"/>
      <text x="29" y="14" fill="#9deeff" font-size="16" font-weight="700" letter-spacing="3.1">OPEN SOURCE  /  NATIVE macOS</text>
    </g>
    <text x="82" y="312" fill="#f5f8fa" font-size="126" font-weight="650" letter-spacing="-5">Native CAD</text>
    <text x="82" y="438" fill="#f5f8fa" font-size="126" font-weight="650" letter-spacing="-5">for Mac.</text>
    <path d="M87 491H170" stroke="#27d9ff" stroke-width="7"/>
    <text x="86" y="560" fill="#afbdc8" font-size="28" font-weight="400">View, measure, and mark up complex</text>
    <text x="86" y="601" fill="#afbdc8" font-size="28" font-weight="400">DWG &amp; DXF drawings.</text>
    <g transform="translate(86 700)">
      <g>
        <text x="0" y="0" fill="#27d9ff" font-size="12" font-weight="800" letter-spacing="2.4">01</text>
        <text x="0" y="34" fill="#f4f7f9" font-size="15" font-weight="700" letter-spacing="1.7">OPEN SOURCE</text>
      </g>
      <g transform="translate(202 0)">
        <text x="0" y="0" fill="#27d9ff" font-size="12" font-weight="800" letter-spacing="2.4">02</text>
        <text x="0" y="34" fill="#f4f7f9" font-size="15" font-weight="700" letter-spacing="1.7">BUILT FOR macOS</text>
      </g>
      <g transform="translate(445 0)">
        <text x="0" y="0" fill="#27d9ff" font-size="12" font-weight="800" letter-spacing="2.4">03</text>
        <text x="0" y="34" fill="#f4f7f9" font-size="15" font-weight="700" letter-spacing="1.7">HUGE DRAWINGS</text>
      </g>
      <path d="M0 66H600" stroke="#8193a1" stroke-opacity="0.28"/>
    </g>
    <g transform="translate(86 871)">
      <path d="M0 0H6V39H0ZM17 0H23V39H17Z" fill="#27d9ff"/>
      <text x="43" y="29" fill="#f5f8fa" font-size="27" font-weight="750" letter-spacing="0.8">NovaCAD</text>
    </g>
  </g>

  <!-- Reconstructed NovaCAD window -->
  <g filter="url(#windowShadow)">
    <rect x="920" y="76" width="1490" height="846" rx="25" fill="url(#windowSurface)" stroke="#8ca1b2" stroke-opacity="0.42" stroke-width="2"/>
  </g>
  <g clip-path="url(#appClip)" font-family="Avenir Next, Helvetica Neue, sans-serif">
    <!-- Title bar -->
    <rect x="920" y="76" width="1490" height="55" fill="#1d2730"/>
    <circle cx="951" cy="103" r="8" fill="#ff604d"/><circle cx="977" cy="103" r="8" fill="#f5bd4f"/><circle cx="1003" cy="103" r="8" fill="#46c76d"/>
    <text x="1665" y="109" text-anchor="middle" fill="#dbe4ea" font-size="14" font-weight="600">NovaCAD — Assembly Hall Concept.dxf</text>
    <text x="2367" y="108" fill="#8193a1" font-size="12" letter-spacing="1">82%</text>
    <!-- Ribbon -->
    <rect x="920" y="131" width="1490" height="129" fill="#141d26"/>
    <path d="M920 164H2410M920 259H2410" stroke="#7c8e9c" stroke-opacity="0.25"/>
    <g fill="#9babb8" font-size="10" font-weight="700" letter-spacing="1.5">
      <text x="951" y="153" fill="#71e3fb">HOME</text><text x="1020" y="153">VIEW</text><text x="1082" y="153">TOOLS</text>
    </g>
    <g transform="translate(949 178)" fill="none" stroke="#b5c2cc" stroke-width="2">
      <path d="M0 34L34 0M0 0L34 34"/><circle cx="74" cy="17" r="16"/><path d="M113 34V0H147V34Z"/><path d="M178 34L195 0L212 34Z"/>
      <path d="M254 2H288V32H254Z"/><path d="M262 25L280 8M274 8H281V15"/>
    </g>
    <g fill="#758795" font-size="9" letter-spacing="1">
      <text x="946" y="240">LINE</text><text x="1011" y="240">CIRCLE</text><text x="1062" y="240">RECTANGLE</text><text x="1134" y="240">POLYGON</text><text x="1200" y="240">MOVE</text>
    </g>
    <path d="M1256 174V245M1518 174V245M1780 174V245" stroke="#738694" stroke-opacity="0.22"/>
    <g transform="translate(1290 180)">
      <rect width="184" height="45" rx="5" fill="#0a1118" stroke="#667b8c" stroke-opacity="0.45"/>
      <circle cx="23" cy="22" r="7" fill="#27d9ff"/>
      <text x="42" y="20" fill="#d6e1e8" font-size="11" font-weight="650">A-FLOOR</text>
      <text x="42" y="34" fill="#708391" font-size="8" letter-spacing="1">ACTIVE LAYER</text>
    </g>
    <g transform="translate(1552 179)" fill="none" stroke="#b3c0ca" stroke-width="2">
      <path d="M0 35H38M19 0V54"/><circle cx="19" cy="27" r="14"/>
      <path d="M78 8H116V46H78Z"/><path d="M88 18H106M88 27H106M88 36H101"/>
      <path d="M151 45L172 7L193 45Z"/>
    </g>
    <g fill="#758795" font-size="9" letter-spacing="1">
      <text x="1547" y="240">OSNAP</text><text x="1628" y="240">PROPERTIES</text><text x="1710" y="240">AREA</text>
    </g>
    <!-- Left tool rail -->
    <rect x="920" y="260" width="110" height="565" fill="#111922"/>
    <g transform="translate(942 282)" fill="none" stroke="#96a7b4" stroke-width="2">
      <rect width="64" height="58" rx="7" fill="#27d9ff" fill-opacity="0.09" stroke="#27d9ff" stroke-opacity="0.5"/>
      <path d="M21 38L43 16M21 16L43 38" stroke="#27d9ff"/>
      <rect y="72" width="64" height="58" rx="7"/><circle cx="32" cy="101" r="14"/>
      <rect y="144" width="64" height="58" rx="7"/><path d="M17 188L32 157L47 188Z"/>
      <rect y="216" width="64" height="58" rx="7"/><path d="M16 260L48 230M16 230L48 260"/>
      <rect y="288" width="64" height="58" rx="7"/><path d="M17 327H47M32 302V342"/><circle cx="32" cy="322" r="10"/>
    </g>
    <!-- Drawing canvas -->
    <rect x="1030" y="260" width="1115" height="565" fill="#070d12"/>
    <rect x="1030" y="260" width="1115" height="565" fill="url(#canvasGrid)"/>
    <g clip-path="url(#drawingClip)" fill="none" stroke-linejoin="round">
      <!-- Structural plan -->
      <g stroke="#c1ccd5" stroke-opacity="0.58">
        <path d="M1080 304H2088V778H1080Z" stroke-width="3"/>
        <path d="M1093 317H2075V765H1093Z"/>
        <path d="M1080 421H2088M1080 548H2088M1080 665H2088" stroke-dasharray="9 7"/>
        <path d="M1260 304V778M1440 304V778M1620 304V778M1800 304V778M1980 304V778" stroke-dasharray="9 7"/>
      </g>
      <g fill="#070d12" stroke="#d2dbe2" stroke-opacity="0.72" stroke-width="2">
        <rect x="1069" y="293" width="22" height="22"/><rect x="1249" y="293" width="22" height="22"/><rect x="1429" y="293" width="22" height="22"/><rect x="1609" y="293" width="22" height="22"/><rect x="1789" y="293" width="22" height="22"/><rect x="1969" y="293" width="22" height="22"/><rect x="2077" y="293" width="22" height="22"/>
        <rect x="1069" y="410" width="22" height="22"/><rect x="1249" y="410" width="22" height="22"/><rect x="1429" y="410" width="22" height="22"/><rect x="1609" y="410" width="22" height="22"/><rect x="1789" y="410" width="22" height="22"/><rect x="1969" y="410" width="22" height="22"/>
      </g>
      <!-- Equipment -->
      <g stroke="#b9c6d0" stroke-opacity="0.7" stroke-width="2">
        <g transform="translate(1140 345)"><rect width="250" height="62"/><rect x="16" y="13" width="61" height="36"/><rect x="94" y="13" width="61" height="36"/><rect x="172" y="13" width="61" height="36"/><circle cx="46" cy="31" r="10"/><circle cx="202" cy="31" r="10"/></g>
        <g transform="translate(1490 338)"><rect width="268" height="76"/><circle cx="60" cy="38" r="25"/><circle cx="60" cy="38" r="7"/><path d="M60 31L105 17L132 45L170 28" stroke-width="5"/><rect x="190" y="14" width="58" height="48"/></g>
        <g transform="translate(1830 342)"><rect width="205" height="68"/><path d="M34 0V68M68 0V68M102 0V68M136 0V68M170 0V68M0 34H205"/></g>
        <g transform="translate(1150 590)"><circle cx="60" cy="60" r="53"/><circle cx="60" cy="60" r="39"/><path d="M60 7V113M7 60H113"/><circle cx="190" cy="60" r="53"/><circle cx="190" cy="60" r="39"/><path d="M190 7V113M137 60H243"/></g>
        <g transform="translate(1518 585)"><rect width="245" height="122"/><rect x="18" y="18" width="93" height="36"/><rect x="134" y="18" width="93" height="36"/><rect x="18" y="70" width="93" height="34"/><rect x="134" y="70" width="93" height="34"/><path d="M111 36H134M111 87H134"/></g>
        <g transform="translate(1830 585)"><rect width="204" height="122"/><circle cx="55" cy="42" r="18"/><circle cx="102" cy="42" r="18"/><circle cx="149" cy="42" r="18"/><path d="M55 60V98M102 60V98M149 60V98M30 98H174"/></g>
      </g>
      <g fill="#8fa0ad" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="10" letter-spacing="1.5">
        <text x="1140" y="337">PRESS LINE / P-01</text><text x="1490" y="330">ROBOT CELL / R-04</text><text x="1830" y="334">BUFFER / B-08</text>
        <text x="1150" y="578">PROCESS TANKS / T-21</text><text x="1518" y="573">ASSEMBLY / A-12</text><text x="1830" y="573">INSPECTION / Q-08</text>
      </g>
      <!-- Utility paths -->
      <g stroke="#8799a8" stroke-opacity="0.62" stroke-width="3">
        <path d="M1110 477H1305V518H1470V477H1700V515H2055"/>
        <path d="M1110 487H1295V528H1480V487H1690V525H2055"/>
      </g>
      <!-- Selected assembly cell -->
      <g stroke="#27d9ff" filter="url(#cyanGlow)">
        <rect x="1512" y="579" width="257" height="134" stroke-width="4"/>
        <rect x="1525" y="592" width="231" height="108" stroke-width="1.5" stroke-dasharray="7 5"/>
      </g>
      <g fill="#27d9ff"><rect x="1506" y="573" width="12" height="12"/><rect x="1763" y="573" width="12" height="12"/><rect x="1506" y="707" width="12" height="12"/><rect x="1763" y="707" width="12" height="12"/></g>
      <!-- Markup route -->
      <path d="M1110 535H1220V570H1430V535H1660V758H2025" stroke="#ff604d" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)" marker-end="url(#routeArrow)"/>
      <g fill="#ff604d" stroke="#070d12" stroke-width="3"><circle cx="1110" cy="535" r="8"/><circle cx="1430" cy="535" r="8"/><circle cx="1660" cy="758" r="8"/></g>
      <!-- Measurement -->
      <g stroke="#9aaab8" stroke-width="1.5" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)">
        <path d="M1150 741L1400 741"/><path d="M1150 716V754M1400 716V754" marker-start="none" marker-end="none"/>
      </g>
      <text x="1234" y="734" fill="#b9c6d0" font-size="11" letter-spacing="1.5">42'-8 3/4&quot;</text>
      <!-- Crosshair -->
      <g transform="translate(1660 535)" stroke="#27d9ff" stroke-opacity="0.9"><circle r="12" fill="none"/><path d="M-32 0H32M0-32V32"/><circle r="3" fill="#27d9ff"/></g>
    </g>
    <!-- Layers panel -->
    <rect x="2145" y="260" width="265" height="565" fill="url(#sideSurface)"/>
    <text x="2170" y="291" fill="#dae3e9" font-size="12" font-weight="750" letter-spacing="2">LAYERS</text>
    <path d="M2165 308H2390" stroke="#718492" stroke-opacity="0.3"/>
    <g font-size="10.5" fill="#b5c1ca">
      <g transform="translate(2170 332)"><circle cx="7" cy="7" r="5" fill="#27d9ff"/><path d="M25 7H45" stroke="#27d9ff" stroke-width="3"/><text x="56" y="11">A-FLOOR</text><text x="199" y="11" fill="#27d9ff">●</text></g>
      <g transform="translate(2170 373)"><circle cx="7" cy="7" r="5" fill="#ff604d"/><path d="M25 7H45" stroke="#ff604d" stroke-width="3"/><text x="56" y="11">MARKUP</text><text x="199" y="11" fill="#788b99">●</text></g>
      <g transform="translate(2170 414)"><circle cx="7" cy="7" r="5" fill="#94a4b0"/><path d="M25 7H45" stroke="#94a4b0" stroke-width="2"/><text x="56" y="11">EQUIPMENT</text><text x="199" y="11" fill="#788b99">●</text></g>
      <g transform="translate(2170 455)"><circle cx="7" cy="7" r="5" fill="#647684"/><path d="M25 7H45" stroke="#647684" stroke-width="2" stroke-dasharray="4 3"/><text x="56" y="11">STRUCTURE</text><text x="199" y="11" fill="#788b99">●</text></g>
      <g transform="translate(2170 496)"><circle cx="7" cy="7" r="5" fill="#53636f"/><path d="M25 7H45" stroke="#82929f" stroke-width="2"/><text x="56" y="11">UTILITIES</text><text x="199" y="11" fill="#788b99">●</text></g>
    </g>
    <path d="M2165 534H2390" stroke="#718492" stroke-opacity="0.3"/>
    <text x="2170" y="563" fill="#dae3e9" font-size="12" font-weight="750" letter-spacing="2">PROPERTIES</text>
    <g fill="#778a98" font-size="9.5" letter-spacing="1">
      <text x="2170" y="598">TYPE</text><text x="2292" y="598" fill="#cbd5dd">POLYLINE</text>
      <text x="2170" y="628">LAYER</text><text x="2292" y="628" fill="#cbd5dd">A-FLOOR</text>
      <text x="2170" y="658">COLOR</text><text x="2292" y="658" fill="#27d9ff">BYLAYER</text>
      <text x="2170" y="688">LENGTH</text><text x="2292" y="688" fill="#cbd5dd">42'-8 3/4&quot;</text>
    </g>
    <!-- Command line and status -->
    <rect x="920" y="825" width="1490" height="51" fill="#0a1118"/>
    <circle cx="1055" cy="850" r="5" fill="#27d9ff" filter="url(#softGlow)"/>
    <text x="1072" y="855" fill="#80e8ff" font-size="10" font-weight="750" letter-spacing="1.4">COMMAND</text>
    <text x="1160" y="855" fill="#d0dae2" font-size="12">Specify next point or [Close/Undo]:</text>
    <rect x="2248" y="837" width="52" height="25" rx="5" fill="#17222c"/><text x="2265" y="854" fill="#8fa0ad" font-size="9">ESC</text>
    <rect x="920" y="876" width="1490" height="46" fill="#151e27"/>
    <g font-size="9" font-weight="700" letter-spacing="1.2">
      <text x="1040" y="903" fill="#27d9ff">SNAP</text><circle cx="1083" cy="899" r="3.5" fill="#27d9ff"/>
      <text x="1110" y="903" fill="#728592">ORTHO</text><circle cx="1163" cy="899" r="3.5" fill="#435360"/>
      <text x="1190" y="903" fill="#27d9ff">GRID</text><circle cx="1232" cy="899" r="3.5" fill="#27d9ff"/>
      <text x="2020" y="903" fill="#81939f">MODEL</text><text x="2095" y="903" fill="#81939f">DECIMAL</text><text x="2318" y="903" fill="#c7d1d9">82%</text>
    </g>
  </g>

  <!-- Floating live measurement chip -->
  <g transform="translate(1748 724)" font-family="Avenir Next, Helvetica Neue, sans-serif" filter="url(#windowShadow)">
    <rect width="290" height="80" rx="12" fill="#0c161f" stroke="#27d9ff" stroke-opacity="0.65"/>
    <text x="18" y="25" fill="#75e6ff" font-size="9" font-weight="800" letter-spacing="1.8">DISTANCE</text>
    <text x="18" y="59" fill="#ffffff" font-size="25" font-weight="650">42'-8 3/4&quot;</text>
    <text x="202" y="57" fill="#758895" font-size="9" letter-spacing="1">0.00°</text>
  </g>

  <rect x="1" y="1" width="2498" height="998" fill="none" stroke="#b4c4d0" stroke-opacity="0.12" stroke-width="2"/>
</svg>

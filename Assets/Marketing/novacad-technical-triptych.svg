<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1000" viewBox="0 0 2500 1000" role="img" aria-labelledby="title description">
  <title id="title">NovaCAD Technical Triptych</title>
  <desc id="description">A dark three-scene marketing hero showing NovaCAD navigation, measurement, and markup workflows with original fictional geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="0.5" stop-color="#091019"/>
      <stop offset="1" stop-color="#07131b"/>
    </linearGradient>
    <radialGradient id="aura" cx="68%" cy="48%" r="68%">
      <stop offset="0" stop-color="#208cff" stop-opacity="0.14"/>
      <stop offset="0.52" stop-color="#27d9ff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#05080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15212b" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#090f15" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="panelCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182733"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9bafbe" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V11" stroke="#95a7b5" stroke-opacity="0.17"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.68"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="navClip"><rect x="585" y="170" width="520" height="675" rx="18"/></clipPath>
    <clipPath id="measureClip"><rect x="1060" y="84" width="710" height="820" rx="21"/></clipPath>
    <clipPath id="markupClip"><rect x="1725" y="154" width="620" height="704" rx="18"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M9 4.5L0 0V9Z" fill="#b6c4ce"/>
    </marker>
    <marker id="route" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12L3 6Z" fill="#ff604d"/>
    </marker>
  </defs>

  <rect width="2500" height="1000" fill="url(#bg)"/>
  <rect width="2500" height="1000" fill="url(#aura)"/>
  <rect width="2500" height="1000" fill="url(#grid)" opacity="0.46"/>

  <!-- Atmospheric drafting marks -->
  <g fill="none" stroke="#27d9ff" stroke-opacity="0.065">
    <circle cx="1540" cy="490" r="430" stroke-width="3"/>
    <circle cx="1540" cy="490" r="310"/>
    <path d="M470 885L2220 54M710 38L2250 914"/>
  </g>
  <g font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="700" fill="#d4e2ec" opacity="0.035">
    <text x="460" y="940" font-size="510" letter-spacing="-28">42.08</text>
    <text x="1960" y="280" font-size="210" transform="rotate(90 1960 280)">X+108</text>
  </g>
  <g stroke="#7e92a1" stroke-opacity="0.22"><path d="M556 65V105M536 85H576M2387 65V105M2367 85H2407M556 885V925M536 905H576M2387 885V925M2367 905H2407"/></g>

  <!-- Left title rail -->
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <g transform="translate(78 82)">
      <path d="M0 0H6V44H0ZM18 0H24V44H18Z" fill="#27d9ff"/>
      <text x="45" y="33" fill="#f4f8fa" font-size="31" font-weight="760" letter-spacing="0.9">NovaCAD</text>
    </g>
    <text x="76" y="273" fill="#f6f9fb" font-size="82" font-weight="650" letter-spacing="-3">Native CAD</text>
    <text x="76" y="360" fill="#f6f9fb" font-size="82" font-weight="650" letter-spacing="-3">for Mac.</text>
    <path d="M80 414H148" stroke="#27d9ff" stroke-width="6"/>
    <text x="78" y="485" fill="#a8b7c2" font-size="23">Find what matters.</text>
    <text x="78" y="519" fill="#a8b7c2" font-size="23">Measure what changes.</text>
    <text x="78" y="553" fill="#a8b7c2" font-size="23">Mark up what comes next.</text>
    <g transform="translate(78 640)">
      <rect width="270" height="40" rx="20" fill="#27d9ff" fill-opacity="0.09" stroke="#27d9ff" stroke-opacity="0.45"/>
      <circle cx="21" cy="20" r="5" fill="#27d9ff" filter="url(#softGlow)"/>
      <text x="39" y="25" fill="#a7efff" font-size="12" font-weight="750" letter-spacing="2.2">OPEN SOURCE FOR macOS</text>
    </g>
    <text x="79" y="743" fill="#738592" font-size="15" letter-spacing="0.5">A fast, native workspace</text>
    <text x="79" y="768" fill="#738592" font-size="15" letter-spacing="0.5">for complex DWG &amp; DXF files.</text>
    <text x="78" y="905" fill="#27d9ff" font-size="11" font-weight="800" letter-spacing="2.5">DRAWING WORKFLOW / 01—03</text>
  </g>
  <path d="M500 70V927" stroke="#91a5b4" stroke-opacity="0.18"/>

  <!-- Navigate panel -->
  <g filter="url(#shadow)"><rect x="585" y="170" width="520" height="675" rx="18" fill="url(#panel)" stroke="#7e93a3" stroke-opacity="0.36"/></g>
  <g clip-path="url(#navClip)" font-family="Avenir Next, Helvetica Neue, sans-serif">
    <rect x="585" y="170" width="520" height="64" fill="#1a2630"/>
    <circle cx="611" cy="202" r="7" fill="#ff604d"/><circle cx="635" cy="202" r="7" fill="#f3bc4d"/><circle cx="659" cy="202" r="7" fill="#45c66d"/>
    <text x="837" y="207" text-anchor="middle" fill="#acbbc6" font-size="11">Plant Concept / East Wing</text>
    <rect x="585" y="234" width="520" height="611" fill="#070d12"/>
    <rect x="585" y="234" width="520" height="611" fill="url(#grid)"/>
    <!-- dense original drawing -->
    <g fill="none" stroke="#aebbc5" stroke-opacity="0.56" stroke-width="1.5">
      <path d="M620 292H1065V801H620Z" stroke-width="3"/>
      <path d="M636 308H1049V785H636Z"/>
      <path d="M620 382H1065M620 476H1065M620 570H1065M620 664H1065" stroke-dasharray="7 6"/>
      <path d="M710 292V801M800 292V801M890 292V801M980 292V801" stroke-dasharray="7 6"/>
      <path d="M658 330H770V366H658ZM820 326H946V370H820ZM658 420H750V459H658ZM790 415H958V462H790Z"/>
      <circle cx="696" cy="522" r="34"/><circle cx="696" cy="522" r="24"/><circle cx="776" cy="522" r="34"/><circle cx="776" cy="522" r="24"/>
      <path d="M645 615H842V715H645Z"/><path d="M663 633H735V674H663ZM752 633H824V674H752ZM663 687H824"/>
      <path d="M875 605H1025V723H875Z"/><circle cx="915" cy="645" r="20"/><circle cx="975" cy="645" r="20"/><path d="M915 665V698M975 665V698M895 698H995"/>
      <path d="M644 746H1026" stroke-dasharray="14 7 2 7"/>
    </g>
    <g fill="#80919e" font-size="8" letter-spacing="1.2">
      <text x="658" y="321">CELL A-01</text><text x="820" y="317">CELL A-02</text><text x="648" y="605">ASSEMBLY</text><text x="875" y="595">INSPECTION</text>
    </g>
    <!-- search overlay -->
    <g transform="translate(636 254)" filter="url(#shadow)">
      <rect width="412" height="122" rx="11" fill="#111c25" stroke="#27d9ff" stroke-opacity="0.45"/>
      <circle cx="28" cy="26" r="10" fill="none" stroke="#8a9ba8" stroke-width="2"/><path d="M35 34L43 42" stroke="#8a9ba8" stroke-width="2"/>
      <text x="54" y="32" fill="#f0f5f8" font-size="15" font-weight="600">PUMP-204</text>
      <text x="373" y="31" fill="#718492" font-size="10">3 results</text>
      <path d="M15 51H397" stroke="#728594" stroke-opacity="0.26"/>
      <rect x="13" y="60" width="386" height="47" rx="6" fill="#27d9ff" fill-opacity="0.1"/>
      <circle cx="31" cy="83" r="5" fill="#27d9ff"/>
      <text x="48" y="79" fill="#dce6ec" font-size="11" font-weight="650">PUMP-204 / PROCESS LOOP</text>
      <text x="48" y="96" fill="#748795" font-size="9">E-EQUIPMENT · EAST BAY</text>
    </g>
    <!-- highlighted result -->
    <g transform="translate(760 505)" filter="url(#glow)">
      <circle r="44" fill="#27d9ff" fill-opacity="0.08" stroke="#27d9ff" stroke-width="3"/>
      <circle r="29" fill="none" stroke="#27d9ff"/>
      <path d="M-15 0H15M0-15V15" stroke="#27d9ff"/>
    </g>
    <rect x="713" y="553" width="146" height="26" rx="5" fill="#27d9ff" fill-opacity="0.13"/>
    <text x="726" y="570" fill="#8ceaff" font-size="10" font-weight="750" letter-spacing="1.4">PUMP-204 FOUND</text>
  </g>
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <text x="610" y="883" fill="#27d9ff" font-size="12" font-weight="800" letter-spacing="2.5">01</text>
    <text x="648" y="883" fill="#eef3f6" font-size="16" font-weight="750" letter-spacing="2.2">NAVIGATE</text>
  </g>

  <!-- Dominant Measure panel -->
  <g filter="url(#shadow)"><rect x="1060" y="84" width="710" height="820" rx="21" fill="url(#panelCenter)" stroke="#27d9ff" stroke-opacity="0.45" stroke-width="2"/></g>

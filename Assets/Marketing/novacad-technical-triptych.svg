    </g>
    <g fill="#8395a2" font-size="9" letter-spacing="1.3"><text x="1154" y="338">PACK CELL / PK-03</text><text x="1438" y="314">TANK T-14</text><text x="1465" y="622">TEST BENCH / Q-02</text></g>
    <!-- diagonal measurement -->
    <g stroke="#27d9ff" filter="url(#glow)">
      <path d="M1170 716L1644 353" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M1152 699L1188 733M1626 336L1662 370" stroke-width="1.5"/>
      <circle cx="1170" cy="716" r="9" fill="#070d12" stroke-width="3"/><circle cx="1644" cy="353" r="9" fill="#070d12" stroke-width="3"/>
      <path d="M1155 716H1185M1170 701V731M1629 353H1659M1644 338V368" stroke-width="1"/>
    </g>
    <g transform="translate(1288 475)" filter="url(#shadow)">
      <rect width="316" height="122" rx="13" fill="#0c1720" stroke="#27d9ff" stroke-opacity="0.72"/>
      <text x="18" y="28" fill="#83eaff" font-size="10" font-weight="800" letter-spacing="2">LIVE DISTANCE</text>
      <text x="18" y="74" fill="#ffffff" font-size="34" font-weight="650">42'-8 3/4&quot;</text>
      <text x="20" y="103" fill="#7d909e" font-size="10" letter-spacing="1.3">ΔX 31'-2&quot;  ·  ΔY 29'-3&quot;  ·  43.2°</text>
    </g>
    <g transform="translate(1060 855)">
      <rect width="710" height="49" fill="#0b131a"/>
      <circle cx="24" cy="25" r="5" fill="#27d9ff"/>
      <text x="39" y="29" fill="#7ce8ff" font-size="9" font-weight="800" letter-spacing="1.4">COMMAND</text>
      <text x="127" y="29" fill="#cbd5dd" font-size="11">Specify second point:</text>
      <text x="610" y="29" fill="#27d9ff" font-size="9" font-weight="750">SNAP ON</text>
    </g>
  </g>
  <g font-family="Avenir Next, Helvetica Neue, sans-serif">
    <text x="1090" y="947" fill="#27d9ff" font-size="12" font-weight="800" letter-spacing="2.5">02</text>
    <text x="1128" y="947" fill="#eef3f6" font-size="16" font-weight="750" letter-spacing="2.2">MEASURE</text>
  </g>

  <!-- Markup panel -->

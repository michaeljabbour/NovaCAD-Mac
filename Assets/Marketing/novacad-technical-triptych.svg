      <rect x="2085" y="320" width="148" height="54" stroke-dasharray="7 5"/>
    </g>
    <g fill="#27d9ff"><rect x="2065" y="300" width="12" height="12"/><rect x="2241" y="300" width="12" height="12"/><rect x="2065" y="382" width="12" height="12"/><rect x="2241" y="382" width="12" height="12"/></g>
    <!-- proposed route -->
    <path d="M1795 478H1880V435H2025V478H2138V520H2272V478" fill="none" stroke="#ff604d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" marker-end="url(#route)"/>
    <g fill="#ff604d" stroke="#070d12" stroke-width="3"><circle cx="1795" cy="478" r="9"/><circle cx="2025" cy="478" r="9"/><circle cx="2138" cy="520" r="9"/></g>
    <text x="2082" y="549" fill="#ff8272" font-size="9.5" font-weight="750" letter-spacing="1.4">PROPOSED ROUTE / R1</text>

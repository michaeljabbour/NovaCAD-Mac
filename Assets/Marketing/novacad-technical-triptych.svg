      <rect x="1805" y="318" width="160" height="58"/><circle cx="1843" cy="347" r="18"/><circle cx="1926" cy="347" r="18"/>
      <rect x="2078" y="313" width="162" height="68"/><path d="M2095 330H2150V364H2095ZM2167 330H2223V364H2167Z"/>

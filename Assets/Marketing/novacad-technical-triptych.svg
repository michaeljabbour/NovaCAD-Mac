    <g transform="translate(1087 171)" fill="none" stroke="#a9b8c4" stroke-width="2">
      <circle cx="20" cy="20" r="17"/><path d="M20 8V32M8 20H32"/>
      <path d="M70 36L101 5M70 5L101 36"/>
      <rect x="133" y="4" width="39" height="34"/><path d="M143 14H162M143 22H162M143 30H157"/>
      <path d="M211 37L230 3L249 37Z"/>
    </g>
    <g fill="#748795" font-size="8.5" letter-spacing="1">
      <text x="1085" y="230">OSNAP</text><text x="1150" y="230">DISTANCE</text><text x="1220" y="230">PROPERTIES</text><text x="1300" y="230">AREA</text>
    </g>
    <rect x="1060" y="245" width="710" height="610" fill="#070d12"/>
    <rect x="1060" y="245" width="710" height="610" fill="url(#grid)"/>
    <!-- fictional bay -->
    <g fill="none" stroke="#bdc9d2" stroke-opacity="0.65">
      <path d="M1110 300H1725V803H1110Z" stroke-width="3"/>
      <path d="M1126 316H1709V787H1126Z"/>
      <path d="M1110 441H1725M1110 590H1725" stroke-dasharray="10 7"/>
      <path d="M1260 300V803M1410 300V803M1560 300V803" stroke-dasharray="10 7"/>
      <rect x="1154" y="348" width="204" height="70" stroke-width="2"/>
      <path d="M1172 365H1232V401H1172ZM1250 365H1340V401H1250Z"/>
      <circle cx="1490" cy="382" r="55" stroke-width="2"/><circle cx="1490" cy="382" r="39"/><path d="M1490 327V437M1435 382H1545"/>
      <rect x="1594" y="340" width="90" height="84" stroke-width="2"/><path d="M1610 356H1668V408H1610ZM1639 356V408"/>

      <circle cx="18" cy="53" r="4" fill="#ff604d"/><text x="31" y="57" fill="#cad4dc" font-size="8.5">MARKUP</text><text x="119" y="57" fill="#ff604d">●</text>
      <circle cx="18" cy="81" r="4" fill="#27d9ff"/><text x="31" y="85" fill="#cad4dc" font-size="8.5">A-FLOOR</text><text x="119" y="85" fill="#7c8f9d">●</text>
      <circle cx="18" cy="109" r="4" fill="#899aa7"/><text x="31" y="113" fill="#cad4dc" font-size="8.5">EQUIP</text><text x="119" y="113" fill="#7c8f9d">●</text>
      <text x="13" y="133" fill="#687b89" font-size="7" letter-spacing="1">3 VISIBLE</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="NovaCAD architecture: drawing files flow through CADCore and the NovaCAD app to outputs">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4DD0E1"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#151A1F"/>

  <text x="40" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#E6EDF3">NovaCAD — architecture</text>
  <text x="40" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9AA7B4">one Swift package · two targets · no third-party code</text>

  <!-- Panels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- 1. Drawing files -->
    <rect x="40" y="100" width="240" height="340" rx="10" fill="#1F262E" stroke="#38424D"/>
    <text x="60" y="132" font-size="12" font-weight="700" fill="#4DD0E1">DRAWING FILES</text>
    <line x1="60" y1="142" x2="260" y2="142" stroke="#38424D"/>
    <text x="60" y="170" font-size="12" fill="#E6EDF3">• DXF drawings</text>
    <text x="60" y="196" font-size="12" fill="#E6EDF3">• DWG (via converter)</text>
    <text x="60" y="222" font-size="12" fill="#E6EDF3">• eTransmit ZIP</text>
    <text x="60" y="248" font-size="12" fill="#E6EDF3">• folders</text>
    <text x="60" y="274" font-size="12" fill="#E6EDF3">• xrefs</text>
    <text x="60" y="322" font-size="10" fill="#9AA7B4">ODA File Converter</text>
    <text x="60" y="338" font-size="10" fill="#9AA7B4">or GNU LibreDWG</text>

    <!-- 2. CADCore -->
    <rect x="320" y="100" width="240" height="340" rx="10" fill="#1F262E" stroke="#38424D"/>
    <text x="340" y="132" font-size="12" font-weight="700" fill="#4DD0E1">CADCORE</text>
    <line x1="340" y1="142" x2="540" y2="142" stroke="#38424D"/>
    <text x="340" y="170" font-size="12" fill="#E6EDF3">• streaming DXF parser</text>
    <text x="340" y="196" font-size="12" fill="#E6EDF3">• geometry &amp; NURBS</text>
    <text x="340" y="222" font-size="12" fill="#E6EDF3">• block &amp; layer</text>
    <text x="352" y="238" font-size="12" fill="#E6EDF3">  resolution</text>
    <text x="340" y="264" font-size="12" fill="#E6EDF3">• DWG → DXF bridge</text>
    <text x="340" y="312" font-size="10" fill="#9AA7B4">reusable library target</text>

    <!-- 3. App -->
    <rect x="600" y="100" width="240" height="340" rx="10" fill="#1F262E" stroke="#38424D"/>
    <text x="620" y="132" font-size="12" font-weight="700" fill="#4DD0E1">NOVACAD APP</text>
    <line x1="620" y1="142" x2="820" y2="142" stroke="#38424D"/>
    <text x="620" y="170" font-size="12" fill="#E6EDF3">• CoreGraphics</text>
    <text x="632" y="186" font-size="12" fill="#E6EDF3">  renderer (async)</text>
    <text x="620" y="212" font-size="12" fill="#E6EDF3">• AppKit canvas</text>
    <text x="620" y="238" font-size="12" fill="#E6EDF3">• layers · xrefs ·</text>
    <text x="632" y="254" font-size="12" fill="#E6EDF3">  properties panels</text>
    <text x="620" y="280" font-size="12" fill="#E6EDF3">• editing &amp; commands</text>
    <text x="620" y="306" font-size="12" fill="#E6EDF3">• AI Assistant</text>

    <!-- 4. Outputs -->
    <rect x="880" y="100" width="240" height="340" rx="10" fill="#1F262E" stroke="#38424D"/>
    <text x="900" y="132" font-size="12" font-weight="700" fill="#4DD0E1">OUTPUTS</text>
    <line x1="900" y1="142" x2="1100" y2="142" stroke="#38424D"/>
    <text x="900" y="170" font-size="12" fill="#E6EDF3">• full-document DXF</text>
    <text x="912" y="186" font-size="12" fill="#E6EDF3">  save</text>
    <text x="900" y="212" font-size="12" fill="#E6EDF3">• markup export</text>
    <text x="900" y="238" font-size="12" fill="#E6EDF3">• CSV extraction</text>
    <text x="900" y="264" font-size="12" fill="#E6EDF3">• PNG snapshots</text>
    <text x="912" y="280" font-size="12" fill="#E6EDF3">  (headless CLI)</text>

    <!-- Arrows -->
    <line x1="284" y1="270" x2="314" y2="270" stroke="#4DD0E1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="564" y1="270" x2="594" y2="270" stroke="#4DD0E1" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="844" y1="270" x2="874" y2="270" stroke="#4DD0E1" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Caption strip -->
  <line x1="40" y1="486" x2="1160" y2="486" stroke="#38424D"/>
  <text x="600" y="516" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9AA7B4">zero third-party dependencies · macOS 15+ · Swift 6 · Apache-2.0</text>
</svg>
